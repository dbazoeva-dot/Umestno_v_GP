<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Уместно — красивый порядок в каждом ящике</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css" />
<style>
  /* ───── Print: render the landing as a tall, portrait document ───── */
  @page {
    size: A3 portrait;
    margin: 0;
  }

  @media print {
    html, body {
      background: var(--u-bg) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Kill sticky / fixed chrome so it doesn't repeat on every page */
    .u-header {
      position: static !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: var(--u-bg) !important;
    }

    /* Hide Tweaks panel and any floating toolbars */
    [data-tweaks-panel],
    .tweaks-panel,
    .__tweaks,
    [data-edit-mode-toolbar] {
      display: none !important;
    }

    /* Keep section internal layout intact — let pages break naturally */
    .u-section,
    .u-hero,
    .u-interlude,
    .u-finalcta,
    .u-finalcta--fade,
    .u-footer {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* Loosen avoid-break on long sections so they can paginate */
    .u-section--linked,
    .u-section--linked-bottom,
    #faq,
    #reviews {
      break-inside: auto;
      page-break-inside: auto;
    }

    /* FAQ — open every item for the printout */
    .u-faq__item .u-faq__a {
      max-height: none !important;
    }
    .u-faq__item .u-faq__q .ic {
      transform: none !important;
    }

    /* Reviews — show all stories stacked for print rather than carousel */
    .u-review-nav { display: none !important; }

    /* Remove hover / transition flashes during render */
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }

    /* Make sure hero/visual side does not get clipped */
    .u-hero { overflow: visible !important; }
    .u-hero--editorial2 .u-hero__img { box-shadow: 0 8px 24px -12px rgba(80,60,40,.35) !important; }

    /* Slightly tighten section padding for print */
    .u-section { padding: 48px 0 !important; }
    .u-section--tight { padding: 28px 0 !important; }
  }

  /* Also apply on-screen so preview matches the PDF */
  body { background: var(--u-bg, #FFFDF9); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel" data-presets="env,react">
  // Open all FAQ items + auto-print once everything is ready
  (async () => {
    // Wait for React to mount
    const waitForRoot = () => new Promise(resolve => {
      const check = () => {
        if (document.querySelector('.u-footer')) resolve();
        else setTimeout(check, 100);
      };
      check();
    });
    await waitForRoot();

    // Wait for fonts
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch(e) {}
    }

    // Wait for all images
    const imgs = Array.from(document.images);
    await Promise.all(imgs.map(img => img.complete ? Promise.resolve() :
      new Promise(res => { img.onload = img.onerror = res; })));

    // Open every FAQ item so its answer prints
    document.querySelectorAll('.u-faq__item').forEach(item => {
      item.classList.add('open');
      const a = item.querySelector('.u-faq__a');
      if (a) a.style.maxHeight = 'none';
    });

    // Tiny settle delay
    await new Promise(r => setTimeout(r, 500));

    window.print();
  })();
</script>
</body>
</html>
