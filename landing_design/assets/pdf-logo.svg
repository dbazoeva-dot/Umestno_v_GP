<!--
  Логотип «Уместно» для PDF. На MVP — текстовая SVG-версия в фирменной типографике.
  Чтобы заменить — просто перезапиши этот файл (имя/путь сохраняй).
  Pdf-рендер на /pdf/?t=TOKEN автоматически подхватит новую версию.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="Уместно">
  <text x="0" y="42"
        font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
        font-size="38" font-weight="500" fill="#3A382F">
    у<tspan font-style="italic">М</tspan>естно
  </text>
</svg>
