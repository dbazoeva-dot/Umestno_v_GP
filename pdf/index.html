<!doctype html>
<!--
  Шаблон для PDF-документа «Ваша схема хранения от Уместно».

  Эта страница не предназначена для прямого открытия в браузере (визуально
  выглядит как имитация листа A4). Её рендерит Puppeteer на сервере при
  обращении к GET /api/pdf/:token — он открывает http://127.0.0.1:3000/pdf/?t=TOKEN,
  ждёт что pdf-render.js успел подтянуть данные, и сохраняет страницу как PDF.

  Состав документа определён в обсуждении с Дзерой:
    1. Шапка: логотип + дата
    2. Размеры ящика
    3. Размеры блоков
    4. Схема (визуализация)
    5. Warnings (если есть)
    6. Инструкции по складыванию (с .webp-картинками для категорий
       boxers/panties/socks/sport_tops, для остальных — только текст)
    7. Подвал: ИП-реквизиты

  SKU-рекомендации сюда НЕ попадают: по оферте они «не предмет договора»,
  плюс Дзера их не упоминала в списке состава.
-->
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Схема хранения — Уместно</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="pdf.css?v=1" />
</head>
<body>

<main class="pdf-page" data-token-fallback>
  <!-- ── Шапка ─────────────────────────────────────────── -->
  <header class="pdf-header">
    <img class="pdf-header__logo" src="../landing_design/assets/pdf-logo.svg" alt="Уместно" />
    <div class="pdf-header__meta">
      <div class="pdf-header__title">Ваша схема хранения</div>
      <div class="pdf-header__date" data-pdf="date">—</div>
    </div>
  </header>

  <!-- ── Размеры ящика + блоков ──────────────────────────── -->
  <section class="pdf-section">
    <h2 class="pdf-section__h">Размеры</h2>
    <div class="pdf-drawer">
      <div class="pdf-drawer__label">Ваш ящик</div>
      <div class="pdf-drawer__value" data-pdf="drawer">— × — × — см</div>
    </div>
    <table class="pdf-blocks">
      <thead>
        <tr><th>Блок</th><th>Что хранить</th><th>Размер (Ш × Г × В)</th></tr>
      </thead>
      <tbody data-pdf="blocks-tbody">
        <!-- заполняется в pdf-render.js -->
      </tbody>
    </table>
  </section>

  <!-- ── Схема ────────────────────────────────────────────── -->
  <section class="pdf-section">
    <h2 class="pdf-section__h">Схема расположения</h2>
    <div class="pdf-scheme" data-pdf="scheme">
      <!-- SVG-визуализацию строит pdf-render.js (или вставит готовую заглушку) -->
    </div>
  </section>

  <!-- ── Warnings ─────────────────────────────────────────── -->
  <section class="pdf-section" data-pdf="warnings-section" hidden>
    <h2 class="pdf-section__h">Обратите внимание</h2>
    <div class="pdf-warnings" data-pdf="warnings">
      <!-- заполняется в pdf-render.js -->
    </div>
  </section>

  <!-- ── Инструкции по складыванию ───────────────────────── -->
  <section class="pdf-section pdf-section--folding">
    <h2 class="pdf-section__h">Как сложить</h2>
    <div class="pdf-folding" data-pdf="folding">
      <!-- заполняется в pdf-render.js: на каждый content_type — карточка
           с картинкой (если есть .webp в /assets/folding/) + текстом -->
    </div>
  </section>

  <!-- ── Подвал ──────────────────────────────────────────── -->
  <footer class="pdf-footer">
    <div class="pdf-footer__line">
      ИП Базоева Дзерасса Александровна · ИНН 772410095363 · ОГРНИП 326774600392102
    </div>
    <div class="pdf-footer__line">
      umestno-home.ru · info@umestno-home.ru
    </div>
    <div class="pdf-footer__line pdf-footer__token" data-pdf="token-line">
      Номер расчёта: —
    </div>
  </footer>
</main>

<script src="../landing_design/content-labels.js?v=10"></script>
<script src="pdf-render.js?v=1"></script>
</body>
</html>
