# Фрагмент nginx-конфига для проксирования /api/* на Node.
# Добавить ВНУТРИ существующего server { } блока для umestno-home.ru
# (там же, где сейчас прописана раздача статики).
#
# После правки:
#   sudo nginx -t                # проверка синтаксиса
#   sudo systemctl reload nginx  # без рестарта, без даунтайма

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Достаточно для расчёта (engine быстрый) + S3 не нужен (картинки не через API).
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    # JSON-ответы небольшие — буферизация ок.
    proxy_buffering on;
}
