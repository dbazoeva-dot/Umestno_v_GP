# Редирект www → без-www (склейка зеркал, главное зеркало = umestno-home.ru).
#
# Зачем: https://www.umestno-home.ru/ отдавал 200 (дублировал контент),
# а не редиректил на https://umestno-home.ru/. Для Яндекса это два разных
# сайта-зеркала → размывается индексация. Нужно, чтобы www всегда уезжал
# на без-www 301-м.
#
# === ВНЕДРЁННЫЙ ВАРИАНТ (применён на VPS 01.06.2026) ===
#
# В существующем HTTPS-блоке (listen 443 ssl, managed by Certbot) этот блок
# обслуживал ОБА хоста: server_name www.umestno-home.ru umestno-home.ru.
# Поэтому www и отдавал 200. Самое малое вмешательство — добавить в этот же
# 443-блок условие-редирект, НЕ трогая server_name и НЕ заводя отдельный
# server-блок. Вставлено сразу после ssl-строк Certbot:

    if ($host = www.umestno-home.ru) {
        return 301 https://umestno-home.ru$request_uri;
    }

# Ключевой момент: адрес назначения прописан ЯВНО (https://umestno-home.ru),
# без $host — иначе www утащило бы себя за собой (как было в port-80 блоке,
# где Certbot сгенерил `return 301 https://$host$request_uri`, сохраняющий www).
#
# http://www обрабатывается так: port-80 блок (managed by Certbot) делает
# 301 на https://$host (т.е. https://www), а затем уже наш if в 443-блоке
# уводит на https://umestno-home.ru. Два хопа — для SEO нормально.
#
# Проверка и применение (без даунтайма):
#   sudo nginx -t
#   sudo systemctl reload nginx
#
#   curl -sI https://www.umestno-home.ru/        # 301 → https://umestno-home.ru/
#   curl -sI https://www.umestno-home.ru/blog/   # 301 → https://umestno-home.ru/blog/
#   curl -sI https://umestno-home.ru/            # 200
#
# === АЛЬТЕРНАТИВА (отдельный server-блок) — НЕ применялась ===
#
# Канонически «чище» вынести www в отдельный server-блок и убрать www из
# server_name основного блока. Но это требует трёх правок и риска
# конфликта server_name при живом редактировании, поэтому выбран вариант
# через if (он же используется самим Certbot в port-80 блоке).
#
#   server {
#       listen 443 ssl;
#       listen [::]:443 ssl;
#       server_name www.umestno-home.ru;
#       ssl_certificate     /etc/letsencrypt/live/umestno-home.ru/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/umestno-home.ru/privkey.pem;
#       return 301 https://umestno-home.ru$request_uri;
#   }
#   # + из основного 443-блока убрать www: server_name umestno-home.ru;
