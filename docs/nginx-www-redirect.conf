# Редирект www → без-www (склейка зеркал, главное зеркало = umestno-home.ru).
#
# Зачем: сейчас https://www.umestno-home.ru/ отдаёт 200 (дублирует контент),
# а не редиректит на https://umestno-home.ru/. Для Яндекса это два разных
# сайта-зеркала → размывается индексация. Нужно, чтобы www всегда уезжал
# на без-www 301-м.
#
# Текущее состояние (см. docs/vps-state.md): в HTTPS-блоке прописано
#   server_name www.umestno-home.ru umestno-home.ru;
# т.е. один блок обслуживает оба хоста. Чтобы развести их — вынести www
# в отдельный server-блок с редиректом, а из основного блока www убрать.
#
# --- Шаг 1. Добавить ОТДЕЛЬНЫЙ server-блок (рядом с существующими) ---
#
# Сертификат уже покрывает www (server_name ... www.umestno-home.ru ...),
# поэтому используем тот же путь к сертификату.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.umestno-home.ru;

    ssl_certificate     /etc/letsencrypt/live/umestno-home.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umestno-home.ru/privkey.pem;

    # Сохраняем путь и query-string: /blog/?x=1 → https://umestno-home.ru/blog/?x=1
    return 301 https://umestno-home.ru$request_uri;
}

# Также добавить www в HTTP→HTTPS-редирект (порт 80), чтобы
# http://www.umestno-home.ru/ тоже уезжал на https без-www за один-два хопа:
#
# server {
#     listen 80;
#     server_name www.umestno-home.ru umestno-home.ru;
#     return 301 https://umestno-home.ru$request_uri;
# }
#
# --- Шаг 2. Из ОСНОВНОГО HTTPS-блока убрать www из server_name ---
#
#   было:  server_name www.umestno-home.ru umestno-home.ru;
#   стало: server_name umestno-home.ru;
#
# Иначе основной блок продолжит сам обслуживать www и наш редирект
# не сработает (конфликт server_name).
#
# --- Шаг 3. Проверить и применить без даунтайма ---
#
#   sudo nginx -t                 # синтаксис
#   sudo systemctl reload nginx   # без рестарта
#
# --- Шаг 4. Проверка ---
#
#   curl -sI https://www.umestno-home.ru/        # ждём: 301 → https://umestno-home.ru/
#   curl -sI https://www.umestno-home.ru/blog/   # ждём: 301 → https://umestno-home.ru/blog/
#   curl -sI https://umestno-home.ru/            # ждём: 200 (без редиректа на себя)
#
# После этого в Яндекс.Вебмастере переотправить на переобход канонические
# URL со слэшем (https://umestno-home.ru/oferta/ и т.д.) — статус «Ошибка» уйдёт.
